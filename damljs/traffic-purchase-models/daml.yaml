sdk-version: 3.5.11
build-options:
    - -Wno-upgrade-interfaces
    # Required: the SDK defaults to LF 2.2, while splice's
    # token-standard DARs and splice-amulet are all LF 2.1. Dropping this still
    # compiles but silently emits LF 2.2 and changes the package id.
    - --target=2.1
name: traffic-purchase-models
source: daml
version: 1.0.0
dependencies:
    - daml-prim
    - daml-stdlib
data-dependencies:
    # The published token-standard DARs out of the splice release pinned in
    # scripts/src/lib/version-config.json, fetched by `pnpm script:fetch:localnet`.
    # The package id is what a real participant checks, so these must be splice's
    # own release artifacts rather than a local build of the same sources.
    - ../../.localnet/dars/splice-api-token-metadata-v1-current.dar
    - ../../.localnet/dars/splice-api-token-holding-v1-current.dar
    - ../../.localnet/dars/splice-api-token-transfer-instruction-v1-current.dar
    # The credit contract TEA ingests. Built by `pnpm generate:canton-traffic-credit`,
    # which must run first.
    - ../canton-traffic-credit/.daml/dist/canton-traffic-credit-1.0.0.dar
