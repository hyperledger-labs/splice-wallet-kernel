name: Examples Under Stress
permissions:
    contents: read

on:
    workflow_dispatch:
        inputs:
            ref:
                description: 'Branch/commit/PR to test (e.g. your-branch-name, main, or refs/pull/123/head). Leave empty to use default branch.'
                default: ''
            network:
                description: 'Localnet version'
                type: choice
                options: [devnet, mainnet]
                default: devnet
            parties_per_interval:
                description: 'PARTIES_PER_INTERVAL'
                default: '3'
            interval_length_ms:
                description: 'INTERVAL_LENGTH_MS'
                default: '7500'
            transfers_per_party:
                description: 'TRANSFERS_PER_PARTY'
                default: '5'
            stress_log_level:
                description: 'BACKGROUND_STRESS_LOG_LEVEL'
                default: 'silent'
            script_name:
                description: 'Run only a single script (full name match, e.g. "06-multi-hosted-party"). Leave empty to run all scripts.'
                default: ''

jobs:
    stress-e2e:
        runs-on: ubuntu-26.04
        timeout-minutes: 120

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.inputs.ref || github.ref }}

            - uses: ./.github/actions/setup_pnpm/initial

            - uses: ./.github/actions/setup_versions
              id: setup
              with:
                  affected: 'false'

            - uses: ./.github/actions/setup_dpm
              with:
                  daml_release_version: ${{ steps.setup.outputs.daml_release_version }}

            - name: Generate all
              run: pnpm run generate:all

            - uses: ./.github/actions/setup_localnet/initial
              with:
                  network: ${{ github.event.inputs.network || 'devnet' }}
                  splice_version: ${{ fromJSON(steps.setup.outputs.versions)[github.event.inputs.network || 'devnet'].splice.version }}

            - uses: ./.github/actions/check_resources

            - name: Run example scripts under background stress
              env:
                  MAX_IO_LISTENERS: '50'
                  PARTIES_PER_INTERVAL: ${{ github.event.inputs.parties_per_interval || '3' }}
                  INTERVAL_LENGTH_MS: ${{ github.event.inputs.interval_length_ms || '7500' }}
                  TRANSFERS_PER_PARTY: ${{ github.event.inputs.transfers_per_party || '5' }}
                  BACKGROUND_STRESS_LOG_LEVEL: ${{ github.event.inputs.stress_log_level || 'silent' }}
                  SCRIPT_NAME: ${{ github.event.inputs.script_name || '' }}
              run: pnpm script:test:examples-stress

            - uses: ./.github/actions/check_resources

            - name: Save container logs (on failure)
              if: failure()
              run: |
                  set -euo pipefail
                  mkdir -p logs
                  for c in $(docker ps -a --format '{{.Names}}'); do
                    docker logs "$c" &> "logs/$c.log" || true
                  done

            - name: Stop localnet (${{ github.event.inputs.network || 'devnet' }})
              if: always()
              run: pnpm run stop:localnet -- --network=${{ github.event.inputs.network || 'devnet' }}

            - name: Scan container logs for secrets
              id: scan_docker_logs
              if: failure()
              uses: ./.github/actions/scan_logs_for_secrets
              with:
                  path: logs/

            # Only published once the scan came back clean, otherwise the leaked
            # value would be downloadable despite the job having failed.
            - name: Upload logs as artifacts
              if: ${{ failure() && steps.scan_docker_logs.outcome == 'success' }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: docker-logs-${{ github.event.inputs.network || 'devnet' }}
                  path: logs/
