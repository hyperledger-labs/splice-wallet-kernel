name: Test Coverage Main
run-name: ${{ github.actor }} is generating test report

on:
    push:
        branches: [main]
    workflow_dispatch:

# Repository vars (e.g. BLOCKDAEMON_*) are not available to workflows from fork PRs.
env:
    CI_SECRET_DEPENDENCY: ${{ github.event.pull_request.head.repo.fork == false }}
    NX_PARALLEL: 100%
    NX_CACHE_DIRECTORY: .nx/cache
permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-26.04
        outputs:
            hydrate-matrix: ${{ steps.setup.outputs.hydrate-matrix }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: ./.github/actions/setup_pnpm/initial

            - uses: ./.github/actions/setup_versions
              id: setup
              with:
                  affected: 'false'

            - uses: ./.github/actions/setup_dpm
              with:
                  daml_release_version: ${{ steps.setup.outputs.daml_release_version }}
                  save_cache: 'true'

            - name: Generate all
              run: pnpm run generate:all

            - name: Check generated code is up to date
              run: |
                  if [ -n "$(git status --porcelain)" ]; then
                    git status --short
                    git --no-pager diff --stat
                    echo "::error::Generated code is out of date. Run 'pnpm generate:all' and commit the result."
                    exit 1
                  fi

            - name: Build project
              run: pnpm build:all

            - name: Upload build artifacts
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: build-dist-${{ github.run_id }}
                  path: |
                      core/*/dist/
                      sdk/*/dist/
                      wallet-gateway/*/dist/
                      examples/*/dist/
                      tools/*/dist/
                      damljs
                      .nx/cache
                      .nx/workspace-data
                  if-no-files-found: error
                  retention-days: 1

    hydrate-canton-caches:
        name: hydrate-canton-caches (${{ matrix.network }}, ${{ matrix.instance }})
        runs-on: ubuntu-26.04
        needs: build
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.build.outputs.hydrate-matrix) }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: ./.github/actions/setup_pnpm/artifacts

            - uses: ./.github/actions/setup_canton/initial
              if: matrix.instance == 'canton'
              with:
                  network: ${{ matrix.network }}
                  canton_version: ${{ matrix.canton_version }}

            - uses: ./.github/actions/setup_localnet/initial
              if: matrix.instance == 'localnet'
              with:
                  network: ${{ matrix.network }}
                  splice_version: ${{ matrix.splice_version }}

    test-unit:
        runs-on: ubuntu-26.04
        needs: build
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: ./.github/actions/setup_pnpm/artifacts

            - uses: ./.github/actions/setup_playwright

            - name: Run all unit tests
              run: |
                  pnpm nx run-many -t test \
                    --parallel \
                    -c coverage

            - name: Coverage summary
              if: ${{ !cancelled() }}
              run: |
                  echo "::group::Unit test coverage summary"
                  pnpm script:coverage:report
                  echo "::endgroup::"
