name: CI on PRs
run-name: ${{ github.actor }} is perfoming a Pull Request

on:
    pull_request:
        types: [opened, reopened, synchronize, edited]

# Repository vars (e.g. BLOCKDAEMON_*) are not available to workflows from fork PRs.
env:
    CI_SECRET_DEPENDENCY: ${{ github.event.pull_request.head.repo.fork == false }}
permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    version-config:
        runs-on: ubuntu-26.04
        outputs:
            daml_release_version: ${{ steps.version.outputs.daml_release_version }}
            devnet_canton_version: ${{ steps.version.outputs.devnet_canton_version }}
            mainnet_canton_version: ${{ steps.version.outputs.mainnet_canton_version }}
            devnet_splice_version: ${{ steps.version.outputs.devnet_splice_version }}
            mainnet_splice_version: ${{ steps.version.outputs.mainnet_splice_version }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Resolve version config outputs
              id: version
              shell: bash
              run: |
                  CONFIG=$(cat scripts/src/lib/version-config.json)
                  echo "daml_release_version=$(echo "$CONFIG" | jq -r '.DAML_RELEASE_VERSION' | tr -d '\r\n')" >> "$GITHUB_OUTPUT"
                  echo "devnet_canton_version=$(echo "$CONFIG" | jq -r '.SUPPORTED_VERSIONS.devnet.canton.version')" >> "$GITHUB_OUTPUT"
                  echo "mainnet_canton_version=$(echo "$CONFIG" | jq -r '.SUPPORTED_VERSIONS.mainnet.canton.version')" >> "$GITHUB_OUTPUT"
                  echo "devnet_splice_version=$(echo "$CONFIG" | jq -r '.SUPPORTED_VERSIONS.devnet.splice.version')" >> "$GITHUB_OUTPUT"
                  echo "mainnet_splice_version=$(echo "$CONFIG" | jq -r '.SUPPORTED_VERSIONS.mainnet.splice.version')" >> "$GITHUB_OUTPUT"

    build:
        runs-on: ubuntu-26.04
        needs: version-config
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: ./.github/actions/setup_pnpm/initial
              with:
                  daml_release_version: ${{ needs.version-config.outputs.daml_release_version }}
                  save_cache: 'true'

            - name: Build project
              run: pnpm build:all

            - name: Upload build artifacts
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: build-dist-${{ github.run_id }}
                  path: |
                      core/*/dist/
                      sdk/*/dist/
                      wallet-gateway/*/dist/
                      examples/*/dist/
                      tools/*/dist/
                      damljs
                      .nx/cache
                      .nx/workspace-data
                  if-no-files-found: error
                  retention-days: 1

    hydrate-canton-caches:
        name: hydrate-canton-caches (${{ matrix.network }}, ${{ matrix.instance }})
        runs-on: ubuntu-26.04
        needs: [version-config, build]
        strategy:
            fail-fast: false
            matrix:
                network: [devnet, mainnet]
                instance: [canton, localnet]
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: ./.github/actions/setup_pnpm/artifacts
              with:
                  daml_release_version: ${{ needs.version-config.outputs.daml_release_version }}

            - uses: ./.github/actions/setup_canton/initial
              if: matrix.instance == 'canton'
              with:
                  network: ${{ matrix.network }}
                  canton_version: ${{ matrix.network == 'devnet' && needs.version-config.outputs.devnet_canton_version || needs.version-config.outputs.mainnet_canton_version }}

            - uses: ./.github/actions/setup_localnet/initial
              if: matrix.instance == 'localnet'
              with:
                  network: ${{ matrix.network }}
                  splice_version: ${{ matrix.network == 'devnet' && needs.version-config.outputs.devnet_splice_version || needs.version-config.outputs.mainnet_splice_version }}

    build-docs:
        runs-on: ubuntu-26.04
        needs: build
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup uv
              uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
              with:
                  enable-cache: true
                  cache-dependency-glob: docs/wallet-integration-guide/uv.lock

            - name: Build docs
              working-directory: docs/wallet-integration-guide
              run: uv run --locked --no-dev sphinx-build -c . src build --fail-on-warning

    test-static:
        runs-on: ubuntu-26.04
        needs: [version-config, build]
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: ./.github/actions/setup_pnpm/artifacts
              with:
                  daml_release_version: ${{ needs.version-config.outputs.daml_release_version }}

            - name: Validate current PR title with commitlint
              run: echo "$TITLE" | pnpm commitlint --verbose
              env:
                  TITLE: ${{ github.event.pull_request.title }}

            - name: check package.json names
              run: pnpm script:cleancoding

            - name: run typechecking
              run: pnpm nx run-many -t typecheck --parallel

            - name: prettier code
              run: pnpm prettier . --check

            - name: eslint code
              run: pnpm nx run-many -t lint --parallel

            - name: check wg schema docs
              run: pnpm docs:update-wg-config

    test-unit:
        runs-on: ubuntu-26.04
        needs: [version-config, build]
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - uses: ./.github/actions/setup_pnpm/artifacts
              with:
                  daml_release_version: ${{ needs.version-config.outputs.daml_release_version }}

            - uses: ./.github/actions/setup_playwright

            - name: Run all unit tests
              run: |
                  pnpm nx run-many -t test \
                    --parallel \
                    -c coverage

            - name: Coverage summary
              if: ${{ !cancelled() }}
              run: |
                  echo "::group::Unit test coverage summary"
                  pnpm script:coverage:report
                  echo "::endgroup::"

    check-migration-lock:
        # Verifies migrations.lock.json is in sync with src/migrations for any
        # affected SQL store package that defines a `migrations:check-lock`
        # script. Catches accidental migration edits
        needs: build
        runs-on: ubuntu-26.04
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - uses: ./.github/actions/setup_pnpm/artifacts

            - name: Check migration lock files
              run: |
                  pnpm nx affected -t migrations:check-lock \
                    --base=origin/${{ github.base_ref }} \
                    --head=HEAD \
                    --parallel

    test-migrations:
        # Runs SQL migration tests for any affected package that defines a
        # `test:migrations` script
        runs-on: ubuntu-26.04
        needs: build
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - uses: ./.github/actions/setup_pnpm/artifacts

            - name: Run affected migration tests
              run: |
                  pnpm nx affected -t test:migrations \
                    --base=origin/${{ github.base_ref }} \
                    --head=HEAD \
                    --parallel=1

    ping-e2e:
        name: ping-e2e (${{ matrix.network }}, ${{ matrix.db }})
        runs-on: ubuntu-26.04
        needs: [version-config, hydrate-canton-caches]
        strategy:
            fail-fast: false
            matrix:
                network: [devnet, mainnet]
                db: [sqlite, postgres]
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: ./.github/actions/setup_pnpm/artifacts
              with:
                  daml_release_version: ${{ needs.version-config.outputs.daml_release_version }}

            - uses: ./.github/actions/setup_canton/artifacts
              with:
                  network: ${{ matrix.network }}
                  canton_version: ${{ matrix.network == 'devnet' && needs.version-config.outputs.devnet_canton_version || needs.version-config.outputs.mainnet_canton_version }}

            - name: Start Postgres container
              if: matrix.db == 'postgres'
              run: |
                  docker run -d --name wk-postgres \
                    -e POSTGRES_USER=postgres \
                    -e POSTGRES_PASSWORD=postgres \
                    -e POSTGRES_DB=postgres \
                    -p 5432:5432 \
                    --health-cmd="pg_isready -U postgres" \
                    --health-interval=2s \
                    postgres:16-alpine

                  until [ "$(docker inspect -f '{{.State.Health.Status}}' wk-postgres)" = "healthy" ]; do
                    sleep 5
                  done
                  docker inspect -f '{{.State.Health.Status}}' wk-postgres | grep -q healthy

            - name: Point gateway config at Postgres
              if: matrix.db == 'postgres'
              run: |
                  CONFIG=wallet-gateway/test/config.json
                  jq '.store.connection = {
                        type: "postgres",
                        host: "localhost",
                        port: 5432,
                        user: "postgres",
                        password: "postgres",
                        database: "wallet"
                      }
                      | .signingStore.connection = {
                        type: "postgres",
                        host: "localhost",
                        port: 5432,
                        user: "postgres",
                        password: "postgres",
                        database: "signing"
                      }' "$CONFIG" > "$CONFIG.tmp"
                  mv "$CONFIG.tmp" "$CONFIG"

            - name: Start remote WK
              run: |
                  if [ "$CI_SECRET_DEPENDENCY" = "true" ]; then
                    export BLOCKDAEMON_API_URL="${{ vars.BLOCKDAEMON_API_URL }}"
                    export BLOCKDAEMON_API_KEY="${{ vars.BLOCKDAEMON_API_KEY }}"
                    export BLOCKDAEMON_API_EMAIL="${{ vars.BLOCKDAEMON_API_EMAIL }}"
                    export FIREBLOCKS_API_PATH="${{ vars.FIREBLOCKS_API_PATH }}"
                    export FIREBLOCKS_API_KEY="${{ vars.FIREBLOCKS_API_KEY }}"
                    export FIREBLOCKS_SECRET="${{ vars.FIREBLOCKS_SECRET }}"
                    export DFNS_BASE_URL="${{ vars.DFNS_BASE_URL }}"
                    export DFNS_ORG_ID="${{ vars.DFNS_ORG_ID }}"
                    export DFNS_CRED_ID="${{ vars.DFNS_CRED_ID }}"
                    export DFNS_PRIVATE_KEY="${{ vars.DFNS_PRIVATE_KEY }}"
                    export DFNS_AUTH_TOKEN="${{ vars.DFNS_AUTH_TOKEN }}"
                  fi
                  pnpm pm2 start ecosystem.ci.config.js --env development

            - uses: ./.github/actions/setup_playwright

            - name: Run example e2e
              env:
                  NETWORK: ${{ matrix.network }}
              run: |
                  if [ "$CI_SECRET_DEPENDENCY" = "true" ]; then
                    export BLOCKDAEMON_API_URL="${{ vars.BLOCKDAEMON_API_URL }}"
                    export FIREBLOCKS_API_PATH="${{ vars.FIREBLOCKS_API_PATH }}"
                    export DFNS_BASE_URL="${{ vars.DFNS_BASE_URL }}"
                  fi
                  pnpm nx playwright:e2e @canton-network/example-ping

            - name: Collect remote PM2 logs
              if: ${{ !cancelled() }}
              run: pnpm pm2 logs remote --raw --nostream --lines 10000 > "wallet-gateway-remote.log" 2>&1 || true

            - name: Scan remote PM2 logs for secrets
              id: scan_ping_gateway_log
              if: ${{ !cancelled() }}
              uses: ./.github/actions/scan_logs_for_secrets
              with:
                  path: wallet-gateway-remote.log

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: ${{ !cancelled() }}
              with:
                  name: example-ping-playwright-report-${{ matrix.network }}-${{ matrix.db }}
                  path: examples/ping/playwright-report/
                  retention-days: 5

            # Only published once the scan came back clean, otherwise the leaked
            # value would be downloadable despite the job having failed.
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: ${{ !cancelled() && steps.scan_ping_gateway_log.outcome == 'success' }}
              with:
                  name: ping-wallet-gateway-remote-log-${{ matrix.network }}-${{ matrix.db }}
                  path: wallet-gateway-remote.log
                  retention-days: 5

            - name: Stop Postgres container
              if: ${{ always() && matrix.db == 'postgres' }}
              run: docker rm -f wk-postgres || true

    test-ping-e2e:
        runs-on: ubuntu-26.04
        needs: ping-e2e
        if: always()
        steps:
            - name: Report ping e2e execution
              run: |
                  if [ "${{ needs.ping-e2e.result }}" != "success" ]; then
                    echo "ping-e2e did not succeed"
                    exit 1
                  fi
                  echo "test-ping-e2e passed"

    extension-e2e:
        name: extension-e2e (devnet)
        runs-on: ubuntu-26.04
        needs: [version-config, build, hydrate-canton-caches]
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: ./.github/actions/setup_pnpm/artifacts
              with:
                  daml_release_version: ${{ needs.version-config.outputs.daml_release_version }}

            - uses: ./.github/actions/setup_canton/artifacts
              with:
                  network: devnet
                  canton_version: ${{ needs.version-config.outputs.devnet_canton_version }}

            - uses: ./.github/actions/setup_playwright

            - name: Run extension e2e
              run: pnpm nx playwright:e2e @canton-network/wallet-gateway-extension

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: ${{ !cancelled() }}
              with:
                  name: wallet-gateway-extension-playwright-report
                  path: wallet-gateway/extension/playwright-report/
                  retention-days: 5

    test-extension-e2e:
        runs-on: ubuntu-26.04
        needs: extension-e2e
        if: always()
        steps:
            - name: Report extension e2e execution
              run: |
                  if [ "${{ needs.extension-e2e.result }}" != "success" ]; then
                    echo "extension-e2e did not succeed"
                    exit 1
                  fi
                  echo "test-extension-e2e passed"

    portfolio-e2e:
        name: portfolio-e2e (${{ matrix.network }})
        runs-on: ubuntu-26.04
        needs: [version-config, hydrate-canton-caches]
        strategy:
            fail-fast: false
            matrix:
                network: [devnet, mainnet]
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: ./.github/actions/setup_pnpm/artifacts
              with:
                  daml_release_version: ${{ needs.version-config.outputs.daml_release_version }}

            - uses: ./.github/actions/setup_localnet/artifacts
              with:
                  network: ${{ matrix.network }}
                  splice_version: ${{ matrix.network == 'devnet' && needs.version-config.outputs.devnet_splice_version || needs.version-config.outputs.mainnet_splice_version }}
                  multi_sync: 'true'

            - name: Start remote WK
              run: pnpm pm2 start ecosystem.ci.config.js --env development

            - uses: ./.github/actions/setup_playwright

            - name: Run example e2e
              run: pnpm nx playwright:e2e @canton-network/example-portfolio

            - name: Collect remote PM2 logs
              if: ${{ !cancelled() }}
              run: pnpm pm2 logs remote --raw --nostream --lines 10000 > "wallet-gateway-remote.log" 2>&1 || true

            - name: Scan remote PM2 logs for secrets
              id: scan_portfolio_gateway_log
              if: ${{ !cancelled() }}
              uses: ./.github/actions/scan_logs_for_secrets
              with:
                  path: wallet-gateway-remote.log

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: ${{ !cancelled() }}
              with:
                  name: example-portfolio-playwright-report-${{ matrix.network }}
                  path: examples/portfolio/playwright-report/
                  retention-days: 5

            # Only published once the scan came back clean, otherwise the leaked
            # value would be downloadable despite the job having failed.
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              if: ${{ !cancelled() && steps.scan_portfolio_gateway_log.outcome == 'success' }}
              with:
                  name: portfolio-wallet-gateway-remote-log-${{ matrix.network }}
                  path: wallet-gateway-remote.log
                  retention-days: 5

    test-portfolio-e2e:
        runs-on: ubuntu-26.04
        needs: portfolio-e2e
        if: always()
        steps:
            - name: Report portfolio e2e execution
              run: |
                  if [ "${{ needs.portfolio-e2e.result }}" != "success" ]; then
                    echo "portfolio-e2e did not succeed"
                    exit 1
                  fi
                  echo "portfolio-e2e passed"

    wallet-sdk-snippets-e2e:
        name: wallet-sdk-snippets-e2e (${{ matrix.network }})
        runs-on: ubuntu-26.04
        needs: [version-config, hydrate-canton-caches]
        strategy:
            fail-fast: false
            matrix:
                network: [devnet, mainnet]

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: ./.github/actions/setup_pnpm/artifacts
              with:
                  daml_release_version: ${{ needs.version-config.outputs.daml_release_version }}

            - uses: ./.github/actions/setup_localnet/artifacts
              with:
                  network: ${{ matrix.network }}
                  splice_version: ${{ matrix.network == 'devnet' && needs.version-config.outputs.devnet_splice_version || needs.version-config.outputs.mainnet_splice_version }}
                  multi_sync: 'true'

            - uses: ./.github/actions/check_resources

            - name: Test example snippets (${{ matrix.network }})
              run: pnpm nx snippets docs-wallet-integration-guide-examples

            - uses: ./.github/actions/check_resources

            - name: Save container logs
              if: failure()
              run: |
                  #!/usr/bin/env bash
                  set -euo pipefail
                  mkdir -p logs
                  for c in $(docker ps -a --format '{{.Names}}'); do
                    docker logs "$c" &> "logs/$c.log" || true
                  done

            - name: Stop Localnet (${{ matrix.network }})
              if: always()
              run: pnpm run stop:localnet -- --network=${{ matrix.network }}

            - name: Scan container logs for secrets
              id: scan_snippets_docker_logs
              if: failure()
              uses: ./.github/actions/scan_logs_for_secrets
              with:
                  path: logs/

            # Only published once the scan came back clean, otherwise the leaked
            # value would be downloadable despite the job having failed.
            - name: Upload logs as artifacts
              if: ${{ failure() && steps.scan_snippets_docker_logs.outcome == 'success' }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: docker-logs-snippets-${{ matrix.network }}
                  path: logs/

    wallet-sdk-scripts-e2e:
        name: wallet-sdk-scripts-e2e (${{ matrix.network }})
        runs-on: ubuntu-26.04
        needs: [version-config, hydrate-canton-caches]
        strategy:
            fail-fast: false
            matrix:
                network: [devnet, mainnet]

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: ./.github/actions/setup_pnpm/artifacts
              with:
                  daml_release_version: ${{ needs.version-config.outputs.daml_release_version }}

            - uses: ./.github/actions/setup_localnet/artifacts
              with:
                  network: ${{ matrix.network }}
                  splice_version: ${{ matrix.network == 'devnet' && needs.version-config.outputs.devnet_splice_version || needs.version-config.outputs.mainnet_splice_version }}
                  multi_sync: 'true'

            - name: Restore DPM cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.dpm
                  key: dpm-${{ runner.os }}-${{ needs.version-config.outputs.daml_release_version }}

            - name: Rebuild DAML-dependent packages
              run: |
                  pnpm run --filter @canton-network/core-splice-codegen build

            - uses: ./.github/actions/check_resources

            - name: Test example scripts (${{ matrix.network }})
              env:
                  MAX_IO_LISTENERS: '50'
              run: pnpm script:test:examples --network=${{ matrix.network }}

            - uses: ./.github/actions/check_resources

            - name: Save container logs
              if: failure()
              run: |
                  #!/usr/bin/env bash
                  set -euo pipefail
                  mkdir -p logs
                  for c in $(docker ps -a --format '{{.Names}}'); do
                    docker logs "$c" &> "logs/$c.log" || true
                  done

            - name: Stop Localnet (${{ matrix.network }})
              if: always()
              run: pnpm run stop:localnet -- --network=${{ matrix.network }}

            - name: Scan container logs for secrets
              id: scan_scripts_docker_logs
              if: failure()
              uses: ./.github/actions/scan_logs_for_secrets
              with:
                  path: logs/

            # Only published once the scan came back clean, otherwise the leaked
            # value would be downloadable despite the job having failed.
            - name: Upload logs as artifacts
              if: ${{ failure() && steps.scan_scripts_docker_logs.outcome == 'success' }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: docker-logs-scripts-${{ matrix.network }}
                  path: logs/

    test-wallet-sdk-e2e:
        name: test-wallet-sdk-e2e
        runs-on: ubuntu-26.04
        needs: [wallet-sdk-snippets-e2e, wallet-sdk-scripts-e2e, wallet-sdk-pkg]
        if: always()
        steps:
            - name: Report wallet-sdk e2e execution
              run: |
                  if [ "${{ needs.wallet-sdk-snippets-e2e.result }}" != "success" ]; then
                    echo "wallet-sdk snippets e2e did not succeed"
                    exit 1
                  fi
                  if [ "${{ needs.wallet-sdk-scripts-e2e.result }}" != "success" ]; then
                    echo "wallet-sdk scripts e2e did not succeed"
                    exit 1
                  fi
                  if [ "${{ needs.wallet-sdk-pkg.result }}" != "success" ]; then
                    echo "wallet-sdk package validation did not succeed"
                    exit 1
                  fi
                  echo "all wallet-sdk-e2e jobs passed"

    wallet-sdk-pkg:
        runs-on: ubuntu-26.04
        needs: [version-config, build]
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: ./.github/actions/setup_pnpm/artifacts
              with:
                  daml_release_version: ${{ needs.version-config.outputs.daml_release_version }}

            - name: Validate SDK package install
              run: pnpm script:validate:package
