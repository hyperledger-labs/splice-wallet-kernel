name: CI on PRs
run-name: ${{ github.actor }} is perfoming a Pull Request

on:
    pull_request:
        types: [opened, reopened, synchronize, edited]

# Repository vars (e.g. BLOCKDAEMON_*) are not available to workflows from fork PRs.
env:
    CI_SECRET_DEPENDENCY: ${{ github.event.pull_request.head.repo.fork == false }}
    NX_PARALLEL: 100%
    NX_CACHE_DIRECTORY: .nx/cache
    NX_BASE: origin/${{ github.base_ref }}
    NX_HEAD: HEAD
permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-26.04
        outputs:
            ping: ${{ steps.affected.outputs.ping }}
            extension: ${{ steps.affected.outputs.extension }}
            portfolio: ${{ steps.affected.outputs.portfolio }}
            sdk-examples: ${{ steps.affected.outputs.sdk-examples }}
            hydrate: ${{ steps.affected.outputs.hydrate }}
            hydrate-matrix: ${{ steps.affected.outputs.hydrate-matrix }}
            ping-matrix: ${{ steps.affected.outputs.ping-matrix }}
            extension-matrix: ${{ steps.affected.outputs.extension-matrix }}
            portfolio-matrix: ${{ steps.affected.outputs.portfolio-matrix }}
            sdk-examples-matrix: ${{ steps.affected.outputs.sdk-examples-matrix }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  filter: tree:0

            - uses: ./.github/actions/setup_pnpm/initial

            - uses: ./.github/actions/setup_versions
              id: setup
              with:
                  affected: 'false'

            - uses: ./.github/actions/setup_dpm
              with:
                  daml_release_version: ${{ steps.setup.outputs.daml_release_version }}
                  save_cache: 'true'

            - name: Generate all
              run: pnpm run generate:all

            - name: Check generated code is up to date
              run: |
                  if [ -n "$(git status --porcelain)" ]; then
                    git status --short
                    git --no-pager diff --stat
                    echo "::error::Generated code is out of date. Run 'pnpm generate:all' and commit the result."
                    exit 1
                  fi

            - name: Build project
              run: pnpm build:all

            - uses: ./.github/actions/setup_versions
              id: affected
              with:
                  affected: 'true'

            - name: Upload build artifacts
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: build-dist-${{ github.run_id }}
                  path: |
                      core/*/dist/
                      sdk/*/dist/
                      wallet-gateway/*/dist/
                      examples/*/dist/
                      tools/*/dist/
                      damljs
                      .nx/cache
                      .nx/workspace-data
                  if-no-files-found: error
                  retention-days: 1

    hydrate-canton-caches:
        name: hydrate-canton-caches (${{ matrix.network }}, ${{ matrix.instance }})
        runs-on: ubuntu-26.04
        needs: build
        if: needs.build.outputs.hydrate == 'true'
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.build.outputs.hydrate-matrix) }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: ./.github/actions/setup_pnpm/artifacts

            - uses: ./.github/actions/setup_canton/initial
              if: matrix.instance == 'canton'
              with:
                  network: ${{ matrix.network }}
                  canton_version: ${{ matrix.canton_version }}

            - uses: ./.github/actions/setup_localnet/initial
              if: matrix.instance == 'localnet'
              with:
                  network: ${{ matrix.network }}
                  splice_version: ${{ matrix.splice_version }}

    build-docs:
        runs-on: ubuntu-26.04
        needs: build
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup uv
              uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
              with:
                  enable-cache: true
                  cache-dependency-glob: docs/wallet-integration-guide/uv.lock

            - name: Build docs
              working-directory: docs/wallet-integration-guide
              run: uv run --locked --no-dev sphinx-build -c . src build --fail-on-warning

    test-static:
        runs-on: ubuntu-26.04
        needs: build
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  filter: tree:0

            - uses: ./.github/actions/setup_pnpm/artifacts

            - name: Validate current PR title with commitlint
              run: echo "$TITLE" | pnpm commitlint --verbose
              env:
                  TITLE: ${{ github.event.pull_request.title }}

            - name: check package.json names
              run: pnpm script:cleancoding

            - name: check dependency specs and catalog
              run: pnpm script:check-catalog

            - name: run typechecking
              run: pnpm nx affected -t typecheck --parallel

            - name: prettier code
              run: pnpm prettier . --check

            - name: eslint code
              run: pnpm nx affected -t lint --parallel

            - name: check wg schema docs
              run: pnpm docs:update-wg-config

    test-unit:
        runs-on: ubuntu-26.04
        needs: build
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  filter: tree:0

            - uses: ./.github/actions/setup_pnpm/artifacts

            - uses: ./.github/actions/setup_playwright

            - name: Run affected unit tests
              run: |
                  pnpm nx affected -t test \
                    --parallel \
                    -c coverage

            - name: Coverage summary
              if: ${{ !cancelled() }}
              run: |
                  echo "::group::Unit test coverage summary"
                  pnpm script:coverage:report --base="$NX_BASE" --head="$NX_HEAD"
                  echo "::endgroup::"

    check-migration-lock:
        # Verifies migrations.lock.json is in sync with src/migrations for any
        # affected SQL store package that defines a `migrations:check-lock`
        # script. Catches accidental migration edits
        needs: build
        runs-on: ubuntu-26.04
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  filter: tree:0

            - uses: ./.github/actions/setup_pnpm/artifacts

            - name: Check migration lock files
              run: pnpm nx affected -t migrations:check-lock --parallel

    test-migrations:
        # Runs SQL migration tests for any affected package that defines a
        # `test:migrations` script
        runs-on: ubuntu-26.04
        needs: build
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  filter: tree:0

            - uses: ./.github/actions/setup_pnpm/artifacts

            - name: Run affected migration tests
              run: pnpm nx affected -t test:migrations --parallel

    ping-e2e:
        name: ping-e2e (${{ matrix.network }}, ${{ matrix.db }})
        runs-on: ubuntu-26.04
        needs: [build, hydrate-canton-caches]
        if: needs.build.outputs.ping == 'true'
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.build.outputs.ping-matrix) }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: ./.github/actions/setup_pnpm/artifacts

            - uses: ./.github/actions/setup_canton/artifacts
              with:
                  network: ${{ matrix.network }}
                  canton_version: ${{ matrix.canton_version }}

            - name: Start Postgres container
              if: matrix.db == 'postgres'
              run: |
                  docker run -d --name wk-postgres \
                    -e POSTGRES_USER=postgres \
                    -e POSTGRES_PASSWORD=postgres \
                    -e POSTGRES_DB=postgres \
                    -p 5432:5432 \
                    --health-cmd="pg_isready -U postgres" \
                    --health-interval=2s \
                    postgres:16-alpine

                  until [ "$(docker inspect -f '{{.State.Health.Status}}' wk-postgres)" = "healthy" ]; do
                    sleep 5
                  done
                  docker inspect -f '{{.State.Health.Status}}' wk-postgres | grep -q healthy

            - name: Point gateway config at Postgres
              if: matrix.db == 'postgres'
              run: |
                  CONFIG=wallet-gateway/test/config.json
                  jq '.store.connection = {
                        type: "postgres",
                        host: "localhost",
                        port: 5432,
                        user: "postgres",
                        password: "postgres",
                        database: "wallet"
                      }
                      | .signingStore.connection = {
                        type: "postgres",
                        host: "localhost",
                        port: 5432,
                        user: "postgres",
                        password: "postgres",
                        database: "signing"
                      }' "$CONFIG" > "$CONFIG.tmp"
                  mv "$CONFIG.tmp" "$CONFIG"

            - name: Start remote WK
              run: |
                  if [ "$CI_SECRET_DEPENDENCY" = "true" ]; then
                    export BLOCKDAEMON_API_URL="${{ vars.BLOCKDAEMON_API_URL }}"
                    export BLOCKDAEMON_API_KEY="${{ vars.BLOCKDAEMON_API_KEY }}"
                    export BLOCKDAEMON_API_EMAIL="${{ vars.BLOCKDAEMON_API_EMAIL }}"
                    export FIREBLOCKS_API_PATH="${{ vars.FIREBLOCKS_API_PATH }}"
                    export FIREBLOCKS_API_KEY="${{ vars.FIREBLOCKS_API_KEY }}"
                    export FIREBLOCKS_SECRET="${{ vars.FIREBLOCKS_SECRET }}"
                    export DFNS_BASE_URL="${{ vars.DFNS_BASE_URL }}"
                    export DFNS_ORG_ID="${{ vars.DFNS_ORG_ID }}"
                    export DFNS_CRED_ID="${{ vars.DFNS_CRED_ID }}"
                    export DFNS_PRIVATE_KEY="${{ vars.DFNS_PRIVATE_KEY }}"
                    export DFNS_AUTH_TOKEN="${{ vars.DFNS_AUTH_TOKEN }}"
                  fi
                  pnpm pm2 start ecosystem.ci.config.js --env development

            - uses: ./.github/actions/setup_playwright

            - name: Run example e2e
              env:
                  NETWORK: ${{ matrix.network }}
              run: |
                  if [ "$CI_SECRET_DEPENDENCY" = "true" ]; then
                    export BLOCKDAEMON_API_URL="${{ vars.BLOCKDAEMON_API_URL }}"
                    export FIREBLOCKS_API_PATH="${{ vars.FIREBLOCKS_API_PATH }}"
                    export DFNS_BASE_URL="${{ vars.DFNS_BASE_URL }}"
                  fi
                  pnpm nx playwright:e2e @canton-network/example-ping

            - name: Collect remote PM2 logs
              if: ${{ !cancelled() }}
              run: pnpm pm2 logs remote --raw --nostream --lines 10000 > "wallet-gateway-remote.log" 2>&1 || true

            - name: Scan remote PM2 logs for secrets
              id: scan_ping_gateway_log
              if: ${{ !cancelled() }}
              uses: ./.github/actions/scan_logs_for_secrets
              with:
                  path: wallet-gateway-remote.log

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: ${{ !cancelled() }}
              with:
                  name: example-ping-playwright-report-${{ matrix.network }}-${{ matrix.db }}
                  path: examples/ping/playwright-report/
                  retention-days: 5

            # Only published once the scan came back clean, otherwise the leaked
            # value would be downloadable despite the job having failed.
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: ${{ !cancelled() && steps.scan_ping_gateway_log.outcome == 'success' }}
              with:
                  name: ping-wallet-gateway-remote-log-${{ matrix.network }}-${{ matrix.db }}
                  path: wallet-gateway-remote.log
                  retention-days: 5

            - name: Stop Postgres container
              if: ${{ always() && matrix.db == 'postgres' }}
              run: docker rm -f wk-postgres || true

    test-ping-e2e:
        runs-on: ubuntu-26.04
        needs: [build, ping-e2e]
        if: always()
        steps:
            - name: Report ping e2e execution
              run: |
                  if [ "${{ needs.build.result }}" != "success" ]; then
                    echo "build or affected detection did not succeed"
                    exit 1
                  fi
                  if [ "${{ needs.build.outputs.ping }}" = "false" ] &&
                     [ "${{ needs.ping-e2e.result }}" = "skipped" ]; then
                    echo "ping-e2e skipped (not affected)"
                    exit 0
                  fi
                  if [ "${{ needs.build.outputs.ping }}" != "true" ] ||
                     [ "${{ needs.ping-e2e.result }}" != "success" ]; then
                    echo "ping-e2e failed or was unexpectedly skipped"
                    exit 1
                  fi
                  echo "test-ping-e2e passed"

    extension-e2e:
        name: extension-e2e (${{ matrix.network }})
        runs-on: ubuntu-26.04
        needs: [build, hydrate-canton-caches]
        if: needs.build.outputs.extension == 'true'
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.build.outputs.extension-matrix) }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: ./.github/actions/setup_pnpm/artifacts

            - uses: ./.github/actions/setup_canton/artifacts
              with:
                  network: ${{ matrix.network }}
                  canton_version: ${{ matrix.canton_version }}

            - uses: ./.github/actions/setup_playwright

            - name: Run extension e2e
              run: pnpm nx playwright:e2e @canton-network/wallet-gateway-extension

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: ${{ !cancelled() }}
              with:
                  name: wallet-gateway-extension-playwright-report-${{ matrix.network }}
                  path: wallet-gateway/extension/playwright-report/
                  retention-days: 5

    test-extension-e2e:
        runs-on: ubuntu-26.04
        needs: [build, extension-e2e]
        if: always()
        steps:
            - name: Report extension e2e execution
              run: |
                  if [ "${{ needs.build.result }}" != "success" ]; then
                    echo "build or affected detection did not succeed"
                    exit 1
                  fi
                  if [ "${{ needs.build.outputs.extension }}" = "false" ] &&
                     [ "${{ needs.extension-e2e.result }}" = "skipped" ]; then
                    echo "extension-e2e skipped (not affected)"
                    exit 0
                  fi
                  if [ "${{ needs.build.outputs.extension }}" != "true" ] ||
                     [ "${{ needs.extension-e2e.result }}" != "success" ]; then
                    echo "extension-e2e failed or was unexpectedly skipped"
                    exit 1
                  fi
                  echo "test-extension-e2e passed"

    portfolio-e2e:
        name: portfolio-e2e (${{ matrix.network }})
        runs-on: ubuntu-26.04
        needs: [build, hydrate-canton-caches]
        if: needs.build.outputs.portfolio == 'true'
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.build.outputs.portfolio-matrix) }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: ./.github/actions/setup_pnpm/artifacts

            - uses: ./.github/actions/setup_localnet/artifacts
              with:
                  network: ${{ matrix.network }}
                  splice_version: ${{ matrix.splice_version }}
                  multi_sync: 'true'

            - name: Start remote WK
              run: pnpm pm2 start ecosystem.ci.config.js --env development

            - uses: ./.github/actions/setup_playwright

            - name: Run example e2e
              run: pnpm nx playwright:e2e @canton-network/example-portfolio

            - name: Collect remote PM2 logs
              if: ${{ !cancelled() }}
              run: pnpm pm2 logs remote --raw --nostream --lines 10000 > "wallet-gateway-remote.log" 2>&1 || true

            - name: Scan remote PM2 logs for secrets
              id: scan_portfolio_gateway_log
              if: ${{ !cancelled() }}
              uses: ./.github/actions/scan_logs_for_secrets
              with:
                  path: wallet-gateway-remote.log

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: ${{ !cancelled() }}
              with:
                  name: example-portfolio-playwright-report-${{ matrix.network }}
                  path: examples/portfolio/playwright-report/
                  retention-days: 5

            # Only published once the scan came back clean, otherwise the leaked
            # value would be downloadable despite the job having failed.
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: ${{ !cancelled() && steps.scan_portfolio_gateway_log.outcome == 'success' }}
              with:
                  name: portfolio-wallet-gateway-remote-log-${{ matrix.network }}
                  path: wallet-gateway-remote.log
                  retention-days: 5

    test-portfolio-e2e:
        runs-on: ubuntu-26.04
        needs: [build, portfolio-e2e]
        if: always()
        steps:
            - name: Report portfolio e2e execution
              run: |
                  if [ "${{ needs.build.result }}" != "success" ]; then
                    echo "build or affected detection did not succeed"
                    exit 1
                  fi
                  if [ "${{ needs.build.outputs.portfolio }}" = "false" ] &&
                     [ "${{ needs.portfolio-e2e.result }}" = "skipped" ]; then
                    echo "portfolio-e2e skipped (not affected)"
                    exit 0
                  fi
                  if [ "${{ needs.build.outputs.portfolio }}" != "true" ] ||
                     [ "${{ needs.portfolio-e2e.result }}" != "success" ]; then
                    echo "portfolio-e2e failed or was unexpectedly skipped"
                    exit 1
                  fi
                  echo "portfolio-e2e passed"

    wallet-sdk-snippets-e2e:
        name: wallet-sdk-snippets-e2e (${{ matrix.network }})
        runs-on: ubuntu-26.04
        needs: [build, hydrate-canton-caches]
        if: needs.build.outputs.sdk-examples == 'true'
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.build.outputs.sdk-examples-matrix) }}

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: ./.github/actions/setup_pnpm/artifacts

            - uses: ./.github/actions/setup_localnet/artifacts
              with:
                  network: ${{ matrix.network }}
                  splice_version: ${{ matrix.splice_version }}
                  multi_sync: 'true'

            - uses: ./.github/actions/check_resources

            - name: Test example snippets (${{ matrix.network }})
              run: pnpm nx snippets docs-wallet-integration-guide-examples

            - uses: ./.github/actions/check_resources

            - name: Save container logs
              if: failure()
              run: |
                  #!/usr/bin/env bash
                  set -euo pipefail
                  mkdir -p logs
                  for c in $(docker ps -a --format '{{.Names}}'); do
                    docker logs "$c" &> "logs/$c.log" || true
                  done

            - name: Stop Localnet (${{ matrix.network }})
              if: always()
              run: pnpm run stop:localnet -- --network=${{ matrix.network }}

            - name: Scan container logs for secrets
              id: scan_snippets_docker_logs
              if: failure()
              uses: ./.github/actions/scan_logs_for_secrets
              with:
                  path: logs/

            # Only published once the scan came back clean, otherwise the leaked
            # value would be downloadable despite the job having failed.
            - name: Upload logs as artifacts
              if: ${{ failure() && steps.scan_snippets_docker_logs.outcome == 'success' }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: docker-logs-snippets-${{ matrix.network }}
                  path: logs/

    wallet-sdk-scripts-e2e:
        name: wallet-sdk-scripts-e2e (${{ matrix.network }})
        runs-on: ubuntu-26.04
        needs: [build, hydrate-canton-caches]
        if: needs.build.outputs.sdk-examples == 'true'
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.build.outputs.sdk-examples-matrix) }}

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: ./.github/actions/setup_pnpm/artifacts

            - uses: ./.github/actions/setup_localnet/artifacts
              with:
                  network: ${{ matrix.network }}
                  splice_version: ${{ matrix.splice_version }}
                  multi_sync: 'true'

            - uses: ./.github/actions/check_resources

            - name: Test example scripts (${{ matrix.network }})
              env:
                  MAX_IO_LISTENERS: '50'
              run: pnpm script:test:examples --network=${{ matrix.network }}

            - uses: ./.github/actions/check_resources

            - name: Save container logs
              if: failure()
              run: |
                  #!/usr/bin/env bash
                  set -euo pipefail
                  mkdir -p logs
                  for c in $(docker ps -a --format '{{.Names}}'); do
                    docker logs "$c" &> "logs/$c.log" || true
                  done

            - name: Stop Localnet (${{ matrix.network }})
              if: always()
              run: pnpm run stop:localnet -- --network=${{ matrix.network }}

            - name: Scan container logs for secrets
              id: scan_scripts_docker_logs
              if: failure()
              uses: ./.github/actions/scan_logs_for_secrets
              with:
                  path: logs/

            # Only published once the scan came back clean, otherwise the leaked
            # value would be downloadable despite the job having failed.
            - name: Upload logs as artifacts
              if: ${{ failure() && steps.scan_scripts_docker_logs.outcome == 'success' }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: docker-logs-scripts-${{ matrix.network }}
                  path: logs/

    test-wallet-sdk-e2e:
        name: test-wallet-sdk-e2e
        runs-on: ubuntu-26.04
        needs:
            [
                build,
                wallet-sdk-snippets-e2e,
                wallet-sdk-scripts-e2e,
                wallet-sdk-pkg,
            ]
        if: always()
        steps:
            - name: Report wallet-sdk e2e execution
              run: |
                  if [ "${{ needs.build.result }}" != "success" ]; then
                    echo "build or affected detection did not succeed"
                    exit 1
                  fi
                  if [ "${{ needs.wallet-sdk-pkg.result }}" != "success" ]; then
                    echo "wallet-sdk package validation did not succeed"
                    exit 1
                  fi
                  if [ "${{ needs.build.outputs.sdk-examples }}" = "false" ] &&
                     [ "${{ needs.wallet-sdk-snippets-e2e.result }}" = "skipped" ] &&
                     [ "${{ needs.wallet-sdk-scripts-e2e.result }}" = "skipped" ]; then
                    echo "wallet-sdk snippets/scripts e2e skipped (not affected)"
                    exit 0
                  fi
                  if [ "${{ needs.build.outputs.sdk-examples }}" != "true" ] ||
                     [ "${{ needs.wallet-sdk-snippets-e2e.result }}" != "success" ] ||
                     [ "${{ needs.wallet-sdk-scripts-e2e.result }}" != "success" ]; then
                    echo "wallet-sdk e2e failed or was unexpectedly skipped"
                    exit 1
                  fi
                  echo "all wallet-sdk-e2e jobs passed"

    wallet-sdk-pkg:
        runs-on: ubuntu-26.04
        needs: build
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: ./.github/actions/setup_pnpm/artifacts

            - name: Validate SDK package install
              run: pnpm script:validate:package
