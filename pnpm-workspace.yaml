strictPeerDependencies: true
catalogMode: strict
catalogPrune: true
update:
    githubActions: true
    ignoreDeps:
        - '@types/node'
packages:
    - api-specs
    - core/**
    - docs/wallet-integration-guide/examples
    - examples/**
    - example-scripts
    - sdk/**
    - scripts
    - mock-oauth2
    - tools/**
    - wallet-gateway/**
allowBuilds:
    '@scarf/scarf': true
    '@swc/core': true
    better-sqlite3: true
    cbor-extract: true
    cpu-features: true
    esbuild: true
    nx: true
    protobufjs: true
    secp256k1: true
    spawn-sync: true
    ssh2: true
peerDependencyRules:
    allowedVersions:
        # Project no longer actively maintained
        openapi-typescript>typescript: '6'
