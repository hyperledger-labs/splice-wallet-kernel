strictPeerDependencies: true
catalogMode: strict
linkWorkspacePackages: true
catalogPrune: true
update:
    githubActions: true
packages:
    - api-specs
    - core/**
    - docs/wallet-integration-guide/examples
    - examples/**
    - example-scripts
    - sdk/**
    - scripts
    - mock-oauth2
    - tools/**
    - wallet-gateway/**
allowBuilds:
    '@scarf/scarf': true
    '@swc/core': true
    better-sqlite3: true
    cbor-extract: true
    cpu-features: true
    esbuild: true
    grpc-tools: true
    nx: true
    protobufjs: true
    secp256k1: true
    spawn-sync: true
    ssh2: true
peerDependencyRules:
    allowedVersions:
        # Project no longer actively maintained
        openapi-typescript>typescript: '6'
        # Can be removed with vite 8
        tsconfck>typescript: '6'
